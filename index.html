[data-theme="dark"]{--bg:#03222A;--s1:#062F38;--s2:#083841;--s3:#0A434D;--edge:rgba(231,201,138,.16);--line:rgba(231,201,138,.24);--grid:rgba(231,201,138,.10);

.panel,.kpi{border:1px solid var(--edge);box-shadow:0 1px 0 rgba(5,46,54,.04)}

.kpi{border:0;border-radius:0;border-right:1px solid var(--edge)}
.kpi:last-child{border-right:0}
.hero h1{font-weight:600}
.finding{background:var(--s1);border:1px solid var(--edge)}
